  # The anniversary potion and gift box are kRO IDs stock rAthena already
  # has under their 21st/22nd anniversary names. kRO reused both IDs for
  # the 24th anniversary (October 2026).
  # Potion: kRO's and iRO's text both list the life potions, defense
  # scroll, Almighty, Infinity Drink, Tyr's Blessing, Power Booster, small
  # mana potion and movement speed for 1 hour. Stock rAthena also gives
  # +20 to all six stats, which neither client lists, so this drops it.
  # The strengths are stock rAthena's. [unverified: the effect values]
  - Id: 100906
    Name: "[Not For Sale] 24th Anniversary All in One Potion"
    Script: |
      specialeffect2 EF_POTION_BERSERK;
      sc_start2 SC_S_LIFEPOTION,3600000,-5,5;
      sc_start2 SC_L_LIFEPOTION,3600000,-7,4;
      sc_start2 SC_M_LIFEPOTION,3600000,-4,3;
      sc_start2 SC_M_DEFSCROLL,3600000,500,200;
      sc_start2 SC_S_MANAPOTION,3600000,-5,5;
      sc_start SC_ALMIGHTY,3600000,30;
      sc_start SC_INFINITY_DRINK,3600000,0;
      sc_start SC_ATKPOTION,3600000,20;
      sc_start SC_MATKPOTION,3600000,20;
      sc_start SC_HITFOOD,3600000,30;
      sc_start SC_FLEEFOOD,3600000,30;
      sc_start4 SC_LIMIT_POWER_BOOSTER,3600000,30,1,5,0;
      sc_start SC_SPEEDUP0,3600000,25;
  # Gift box: 3 potions and a Kafra Buff (7 Days), the same group stock
  # rAthena has (IG_22TH_PRESENT_BOX), and stock's weight matches kRO's 1.
  - Id: 103314
    Name: 24th Anniversary Gift Box
