  # Costume Himmelmez's Wig Selection Box (Coin Exchanger, 40 coins): pick
  # one of the eight colours. AegisName from divine-pride. DelayConsume, so
  # the box goes only once a colour is picked. The server ends an item
  # script as soon as it returns, so a menu can't wait in one: the script
  # starts the menu as an NPC event instead (npc/anniversary24.txt).
  - Id: 106849
    AegisName: SelecLow_Pack7_ID
    Name: Costume Himmelmez's Wig Selection Box
    Type: DelayConsume
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      addtimer 1,"A24_WigBox::OnPick";
