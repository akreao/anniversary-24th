# divine-pride.net (AegisNames, the English names). Trade flags on the new
# items follow kRO's other event gifts: account-bound, storage allowed.
# [unverified: kRO's trade flags for these items]
# Stock rAthena has none
# of the new IDs (checked on Flux159/rathena 8aea17a).

